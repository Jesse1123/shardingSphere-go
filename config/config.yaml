      core_users_remark:
        actualDataNodes: readwrite_ds_0.core_users_remark
      core_channel_areas_rtp:
        actualDataNodes: readwrite_ds_0.core_channel_areas_rtp

    shardingAlgorithms:
      # 分库算法
      database_inline:
        type: INLINE
        props:
          algorithm-expression: readwrite_ds_$->{co_us_id % 2}
      database_wallet_inline:
        type: INLINE
        props:
          algorithm-expression: readwrite_ds_$->{co_uw_id % 2}
      
      # 分表算法
      core_coin_inline: 
        type: INLINE
        props:
          algorithm-expression: core_coin_logs_$->{co_us_id % 256}
      
      slots_core_game_record_inline:
        type: INLINE
        props:
          algorithm-expression: slots_core_game_record_$->{co_us_id % 256}
      core_users_log_inline:
        type: INLINE
        props:
          algorithm-expression: core_users_log_$->{co_us_id % 128}
      payment_time_inline:
        type: INLINE
        props:
          algorithm-expression: core_users_payment_$->{co_usp_month}
      withdra_time_inline:
        type: INLINE
        props:
          algorithm-expression: core_users_withdraw_$->{co_usw_month}
      core_user_wallet_inline:
        type: INLINE
        props:
          algorithm-expression: core_user_wallet_$->{co_uw_id % 16}

    keyGenerators:
      snowflake:
        type: SNOWFLAKE