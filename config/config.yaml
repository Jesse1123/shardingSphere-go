# 简单的 ShardingSphere-Go 演示配置
# 使用 MySQL 数据库，单库分表场景

databaseName: demo_db


# 数据源配置 - 使用 MySQL
dataSources:
  ds_0:
    url: mysql://127.0.0.1:3306/demo_db_0?charset=utf8mb4&parseTime=true&loc=Local
    username: root
    password: 123456
    connectionTimeoutMilliseconds: 30000
    idleTimeoutMilliseconds: 60000
    maxLifetimeMilliseconds: 1800000
    maxPoolSize: 10
  ds_1:
    url: mysql://127.0.0.1:3306/demo_db_1?charset=utf8mb4&parseTime=true&loc=Local
    username: root
    password: 123456
    connectionTimeoutMilliseconds: 30000
    idleTimeoutMilliseconds: 60000
    maxLifetimeMilliseconds: 1800000
    maxPoolSize: 10
# 分片规则配置
rules:
  # 分片规则
  - tables:
      # 订单表 - 单库分表，按 order_id 分 4 张表
      t_order:
        actualDataNodes: ds_${0..1}.t_order_${0..3}
        databaseStrategy:
          standard:
            shardingColumn: order_id
            shardingAlgorithmName: database_inline
        tableStrategy:
          standard:
            shardingColumn: order_id
            shardingAlgorithmName: t_order_inline
        keyGenerateStrategy: snowflake

      # 用户表 - 不分片，绑定到固定数据源
      t_user:
        actualDataNodes: ds_0.t_user

    # 分片算法配置
    shardingAlgorithms:
      database_inline:
        type: INLINE
        props:
          algorithm-expression: ds_$->{order_id % 2}
      t_order_inline:
        type: INLINE
        props:
          algorithm-expression: t_order_$->{order_id % 4}

    # 主键生成器配置
    keyGenerators:
      snowflake:
        type: SNOWFLAKE
