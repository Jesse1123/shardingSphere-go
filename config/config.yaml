      slots_core_config:
        actualDataNodes: readwrite_ds_0.slots_core_config
      core_player_anomaly:
        actualDataNodes: readwrite_ds_0.core_player_anomaly
      core_player_anomaly_record:
        actualDataNodes: readwrite_ds_0.core_player_anomaly_record
      core_player_game_exceptions:
        actualDataNodes: readwrite_ds_0.core_player_game_exceptions
      core_player_ip_monitor:
        actualDataNodes: readwrite_ds_0.core_player_ip_monitor
      core_player_report_recheck:
        actualDataNodes: readwrite_ds_0.core_player_report_recheck
      core_abnormal_comment:
        actualDataNodes: readwrite_ds_0.core_abnormal_comment
      core_document_task:
